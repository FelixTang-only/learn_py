# Copy to config.toml and edit before running:
#   copy config.example.toml config.toml   (Windows)
#   cp config.example.toml config.toml     (macOS / Linux)

poll_interval_seconds = 60
action_delay_ms = [800, 2000]
headless = false
enable_comments = true
enable_messages = true
skip_own_replies = true

# Browser profile directory (login state). Relative to project root.
profile_dir = ".playwright/douyin-profile"
db_path = "data/replies.db"

default_replies = [
  "收到，谢谢关注～",
  "感谢留言，看到会尽快回复哦",
]

# Skip comments/messages containing these words
blacklist_keywords = ["加微信", "代购", "刷粉"]

[urls]
creator = "https://creator.douyin.com/"
comments = "https://creator.douyin.com/creator-micro/interactive/comment"
messages = "https://www.douyin.com/"

# Rules are matched top-to-bottom; first hit wins.
# Keep [[rules]] blocks at the end of the file.
[[rules]]
keywords = ["价格", "多少钱", "怎么买"]
replies = ["私信发你详情哈~", "你好，具体可以看主页置顶～"]

[[rules]]
keywords = ["谢谢", "感谢"]
replies = ["不客气，感谢支持！"]

[[rules]]
keywords = ["你好", "在吗"]
replies = ["你好呀，有什么可以帮你的吗？"]
